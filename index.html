/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}


</style>
</head>

html,body{background:#f1ebdf;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed!important;inset:0!important;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;color:${dt.ink};-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#gl{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none}
.mui{position:absolute;inset:0;pointer-events:none}
.mui .mo{font-family:'JetBrains Mono',ui-monospace,monospace}
.m-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px 0}
.m-logo{width:46px;height:46px;background:${dt.or};display:flex;align-items:center;justify-content:center;flex:none}
.m-tt{flex:1;min-width:0}
.m-tt b{display:block;font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.05}
.m-tt b span{color:${dt.or};font-weight:400}
.m-tt small{display:block;font:600 9px 'JetBrains Mono',monospace;letter-spacing:1.2px;color:${dt.mute};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-clock{text-align:right}
.m-clock b{display:block;font:700 22px 'JetBrains Mono',monospace;letter-spacing:-.5px}
.m-clock small{display:block;font:700 9px 'JetBrains Mono',monospace;letter-spacing:1.2px;color:${dt.or}}
.m-stats{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 62px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m-card{background:rgba(252,250,245,.93);border:1px solid ${dt.line};border-radius:8px;padding:6px 7px 7px;min-width:0}
.m-card i{display:block;font:700 8.5px 'JetBrains Mono',monospace;letter-spacing:1px;color:${dt.mute};font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-card b{display:block;font:700 17px 'JetBrains Mono',monospace;letter-spacing:-.6px;margin-top:2px;white-space:nowrap}
.m-card b small{font-size:10px;color:${dt.mute};margin-left:2px;letter-spacing:0}
.m-card u{display:block;height:4px;border-radius:2px;background:#efe6d8;margin-top:4px;overflow:hidden;text-decoration:none}
.m-card u s{display:block;height:100%;width:0;background:${dt.or};text-decoration:none}
.m-card em{display:block;font:600 8.5px 'JetBrains Mono',monospace;color:${dt.mute};font-style:normal;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-mode{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11.5px;color:#5d554b}
.m-mode b{flex:none;color:#fff;font:700 10px 'JetBrains Mono',monospace;letter-spacing:1.2px;padding:5px 9px;border-radius:11px}
.m-bot{position:absolute;left:0;right:0;bottom:0;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(rgba(241,235,223,0),rgba(241,235,223,.92) 18px);pointer-events:auto}
.m-row{display:flex;align-items:center;gap:8px;padding:0 10px}
.m-chart{position:relative;flex:1;height:64px;background:rgba(252,250,245,.95);border:1px solid ${dt.line};border-radius:8px;touch-action:none}
.m-chart svg{position:absolute;inset:0;width:100%;height:100%}
.m-b{flex:none;height:38px;min-width:38px;padding:0 12px;display:flex;align-items:center;justify-content:center;border:1px solid ${dt.faint};border-radius:8px;background:#fffdf9;font:700 10.5px 'JetBrains Mono',monospace;letter-spacing:1px;color:${dt.ink};white-space:nowrap;cursor:pointer}
.m-b.on{background:${dt.ink};color:#fff;border-color:${dt.ink}}
.m-play{width:46px;height:64px;font-size:16px}
.m-strip{display:flex;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.m-strip::-webkit-scrollbar{display:none}
.m-s2{margin-top:7px}.m-s3{margin-top:6px}
@media (orientation:landscape){.m-s2{margin-top:0}}
.m-lab{flex:none;font:700 8.5px 'JetBrains Mono',monospace;letter-spacing:1.2px;color:${dt.mute};writing-mode:vertical-rl;transform:rotate(180deg);align-self:center}
.m-tour{position:absolute;left:50%;transform:translateX(-50%);height:30px;padding:0 12px;display:flex;align-items:center;gap:7px;border:1px solid ${dt.line};border-radius:15px;background:rgba(252,250,245,.95);font:700 9.5px 'JetBrains Mono',monospace;letter-spacing:1px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.m-tour i{display:block;width:7px;height:7px;border-radius:50%;background:${dt.or}}
.m-tour.on i{animation:mblink 1.2s steps(2) infinite}
@keyframes mblink{50%{opacity:.15}}
.m-call{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;font:700 9.5px 'JetBrains Mono',monospace;letter-spacing:.6px;white-space:nowrap;background:rgba(252,250,245,.9);border:1px solid ${dt.line};border-radius:10px;padding:2px 7px 2px 3px}
.m-call em{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:${dt.or};color:#fff;font-size:8px}
.m-dot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:${dt.or};border:1.5px solid #fff}
@media (orientation:landscape){
  .m-top{padding-left:env(safe-area-inset-left);padding-top:6px}
  .m-logo{width:40px;height:40px}
  .m-stats{left:calc(env(safe-area-inset-left) + 8px);right:auto;top:54px;width:168px;grid-template-columns:1fr 1fr}
  .m-mode{display:none}
  .m-bot{left:calc(env(safe-area-inset-left) + 184px);padding-top:4px;padding-bottom:calc(env(safe-area-inset-bottom) + 4px);background:none}
  .m-bot .m-row{position:fixed;left:calc(env(safe-area-inset-left) + 8px);width:168px;top:214px;padding:0;gap:6px}
  .m-chart,.m-play{height:46px}
  .m-play{width:40px;min-width:40px}
  .m-strip{padding-left:0}
  .m-b{height:34px}
}
